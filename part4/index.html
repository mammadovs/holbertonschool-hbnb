<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Home</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon.png">
</head>
<body>
    <header>
        <img src="logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
            <a href="#" id="logout-link" class="login-button" style="display: none;">Logout</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Welcome to HBnB</h1>
            <p>Find places to stay, explore unique locations, and share your experiences.</p>
        </section>

        <section class="places-section">
            <h2>Available Places</h2>
            
            <!-- Price Filter Dropdown -->
            <div class="filter-container">
                <label for="price-filter">Filter by Max Price:</label>
                <select id="price-filter">
                    <option value="All">All</option>
                    <option value="10">10</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>

            <!-- Places List Container -->
            <div id="places-list" class="places-grid">
                <!-- Places cards will be loaded here dynamically by script.js -->
                <p>Loading places...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
