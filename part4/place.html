<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Place Details</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon.png">
</head>
<body>
    <header>
        <img src="logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>

    <main>
        <div id="place-details-container" class="place-details">
            <!-- Place details will be loaded here dynamically -->
        </div>

        <div id="add-review-section" style="display: none; margin-bottom: 20px;">
            <a href="#" id="review-link" class="details-button">Add Review</a>
        </div>

        <section class="reviews-section">
            <h2>Reviews</h2>
            <div id="reviews-container">
                <!-- Review cards will be loaded here dynamically -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>

    <script>
        // Small helper to dynamically wire the "Add Review" button with current place id from URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const placeId = urlParams.get('id');
            const reviewLink = document.getElementById('review-link');
            if (reviewLink && placeId) {
                reviewLink.href = `add_review.html?place_id=${placeId}`;
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
