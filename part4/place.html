<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Place Details</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icon.png">
</head>
<body>
    <header>
        <img src="logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
            <a href="#" id="logout-link" class="login-button" style="display: none;">Logout</a>
        </nav>
    </header>

    <main>
        <section class="place-details-section">
            <!-- Main place details container required by specs (#place-details) -->
            <div id="place-details">
                <p>Loading place details...</p>
            </div>

            <!-- Add Review Section / Link -->
            <div id="add-review-section" style="display: none; margin: 20px 0;">
                <a href="#" id="review-link" class="details-button">Add Review</a>
            </div>

            <!-- Reviews Section -->
            <section class="reviews-section">
                <h2>Reviews</h2>
                <div id="reviews-container">
                    <p>Loading reviews...</p>
                </div>
            </section>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
